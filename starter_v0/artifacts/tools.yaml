# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >
      Gửi một câu hỏi cho người dùng và chờ câu trả lời ở lượt sau. Dùng khi
      THIẾU thông tin bắt buộc để gọi tool khác (vd: không biết tài khoản,
      không có URL, không có nội dung cần gửi), HOẶC khi cần XIN XÁC NHẬN
      trước khi thực hiện một hành động không thể hoàn tác (vd: gọi `send`).
      Luôn truyền `response_type` tường minh, không bỏ trống.
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type:
          type: string
          enum: [text, yes_no, choice]
          default: "text"
          description: >
            BẮT BUỘC chọn đúng loại, luôn truyền tường minh:
            "text" khi hỏi để lấy một thông tin còn thiếu (tên tài khoản, URL,
            nội dung...); "yes_no" khi xin xác nhận Có/Không trước khi thực
            hiện một hành động, đặc biệt là trước khi gọi `send`; "choice" khi
            đưa ra vài lựa chọn cố định trong `options` để người dùng chọn.
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn, chỉ dùng khi response_type=choice"}
      required: [question, response_type]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: >
      Tìm bài đăng trên mạng xã hội (Twitter/X) theo từ khóa. CHỈ dùng khi
      người dùng nói rõ muốn tìm "tweet", "bài đăng", "mạng xã hội", "social"
      — không dùng cho tin tức/web chung chung (dùng `lookup` cho trường hợp
      đó). Nếu một hội thoại đang nói về tin tức/web (đã gọi `lookup` ở lượt
      trước), các lượt sau vẫn tiếp tục là tin tức/web thì giữ nguyên `lookup`,
      không tự chuyển sang `social_search` trừ khi người dùng nhắc tới tweet.
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: >
            Chỉ từ khóa chủ đề cốt lõi (vd "AI", "robotics"). KHÔNG thêm các
            từ như "tweet", "mới nhất", "tin tức" vào query.
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: >
      Tra cứu thông tin trên web/internet (không phải mạng xã hội). Dùng khi
      người dùng hỏi tin tức, bài viết, thông tin chung trên web. Nếu một
      request nói "tin tức"/"tin AI hôm nay" thì set topic=news và
      timeframe=day; các lượt sau trong cùng hội thoại vẫn đang hỏi tin tức
      thì giữ nguyên topic=news, timeframe=day (carry-over), trừ khi người
      dùng đổi ý rõ ràng.
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: >
            Chỉ từ khóa chủ đề cốt lõi (vd "AI", "robotics"). KHÔNG thêm chữ
            "tin tức"/"news" vào query — việc đó đã được field `topic` thể
            hiện riêng.
        topic: {type: string, enum: [general, news], default: "general", description: "general = tra cứu chung; news = tin tức. Luôn set news nếu người dùng hỏi tin tức."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian. Nếu người dùng nói 'hôm nay' thì set day."}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- Tool mới của nhóm ----------------
  - name: sentiment
    description: >
      Phân tích cảm xúc (tích cực/tiêu cực/trung lập) của một đoạn văn bản.
      CHỈ dùng SAU KHI đã có nội dung text cụ thể (vd kết quả từ `lookup`,
      `fetch`, `timeline`, `social_search`) và người dùng muốn biết cảm
      xúc/thái độ của nội dung đó. KHÔNG dùng để tìm kiếm hay lấy dữ liệu —
      không có khả năng tự lấy nội dung, phải được cung cấp `text` sẵn.
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Đoạn văn bản cần phân tích cảm xúc, phải là nội dung thật đã có sẵn"}
      required: [text]
